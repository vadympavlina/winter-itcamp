<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зимовий ІТ табір — STEP IT Academy</title>
<meta name="theme-color" content="#03306f">
<meta property="og:title" content="Зимовий ІТ табір — STEP IT Academy">
<meta property="og:image" content="assets/logo.png">
<meta name="description" content="Матеріали уроків Зимового ІТ табору STEP IT Academy для груп 6–8 та 9–14 років.">
<link rel="icon" href="assets/logo.png">
<style>
:root{--navy:#03306f;--navy-d:#022252;--ice:#eef4fb;--line:#d6e0ee;--text:#0f2142;--muted:#5d6f8c}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:#fff;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{border-bottom:4px solid var(--ice)}
header .wrap{display:flex;align-items:center;gap:24px;padding-top:20px;padding-bottom:20px}
header img{height:96px;width:auto;display:block}
header h1{margin:0;font-size:clamp(22px,4.5vw,34px);line-height:1.1;letter-spacing:-.02em;font-weight:800;text-transform:uppercase;color:var(--navy)}
header p{margin:4px 0 0;color:var(--muted);font-size:15px}
.drive{background:var(--navy);color:#fff}
.drive .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px;padding-bottom:22px}
.drive h2{margin:0;font-size:19px;font-weight:700}
.drive p{margin:2px 0 0;color:#b9c9e6;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:2px solid var(--navy);background:var(--navy);color:#fff;font:600 15px/1 inherit;font-family:inherit;text-decoration:none;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--navy-d)}
.btn.light{background:#fff;color:var(--navy);border-color:#fff}
.btn.light:hover{background:var(--ice)}
.btn.line{background:#fff;color:var(--navy)}
.btn.line:hover{background:var(--ice)}
.btn:focus-visible,.tab:focus-visible,#q:focus-visible{outline:3px solid #6aa0ff;outline-offset:2px}
svg{width:18px;height:18px;flex:none}
main.wrap{width:100%;flex:1 0 auto;padding-top:36px;padding-bottom:56px}
footer{margin-top:auto}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tabs{display:flex;border:2px solid var(--navy);border-radius:6px;overflow:hidden}
.tab{min-height:44px;padding:0 20px;border:0;background:#fff;color:var(--navy);font:600 15px/1 inherit;font-family:inherit;cursor:pointer}
.tab+.tab{border-left:2px solid var(--navy)}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff}
.tab:hover:not([aria-pressed="true"]){background:var(--ice)}
#q{flex:1;min-width:180px;min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:6px;font:inherit;color:var(--text)}
#q:focus{border-color:var(--navy)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{position:relative;transition:background .15s;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px 16px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}
.item:hover{background:var(--ice)}
.item h3 a{color:inherit;text-decoration:none}
.item h3 a::after{content:"";position:absolute;inset:0}
.acts{position:relative;z-index:1}
.item{padding-left:12px;padding-right:12px}
.cnt{margin-left:8px;font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.num small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1}
.num{line-height:1.1;font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.item h3{margin:0;font-size:18px;line-height:1.3}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px}
.num{grid-row:1/3;padding-top:2px}
.item .acts{grid-column:2;flex-wrap:wrap;gap:10px}
.item .acts .btn{min-height:42px;padding:0 16px;font-size:15px}
.btn.blue{background:#1d6fe0;border-color:#1d6fe0}
.btn.blue:hover{background:#1558b8;border-color:#1558b8}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:600}
.btn.quiet:hover{background:var(--ice);color:var(--navy)}
.btn .tag{font-size:12px;font-weight:600;opacity:.7;margin-left:2px}
.btn svg{width:20px;height:20px}
.item h3 a:focus-visible{outline:3px solid #6aa0ff;outline-offset:4px}
.empty{padding:40px 0;color:var(--muted);border-bottom:1px solid var(--line)}
nav.main{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
nav.main .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.main .wrap::-webkit-scrollbar{display:none}
nav.main button{flex:none;min-height:54px;padding:0 20px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap}
nav.main button:hover{color:var(--navy);background:var(--ice)}
nav.main button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
nav.main button:focus-visible{outline:3px solid #6aa0ff;outline-offset:-3px}
[hidden]{display:none!important}
main{scroll-margin-top:54px}
section.panel{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.panel{animation:none}}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{display:flex;gap:18px;padding:16px;border:1px solid var(--line);border-radius:8px;align-items:flex-start}
.card img{width:130px;flex:none;display:block;border-radius:4px;border:1px solid var(--line);height:auto}
.card .t{margin:0 0 4px;font-size:18px;font-weight:700;line-height:1.3}
.card .m{margin:0 0 14px;color:var(--muted);font-size:14px}
.card .acts{flex-wrap:wrap}
.photo{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.pic{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.pic a.thumb{display:flex;align-items:center;justify-content:center;height:240px;background:var(--ice)}
.pic img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.pic .info{padding:14px 16px 16px}
.pic .cap{margin:0 0 12px;font-weight:700;line-height:1.3}
.pic .cap small{display:block;margin-top:2px;font-weight:500;font-size:13px;color:var(--muted)}
.script{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.script-top{background:var(--ice);padding:18px 20px}
.script-top h3{margin:0 0 14px;font-size:20px;line-height:1.3}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}
.fact{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.fact span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{display:block;font-size:15px;margin-top:2px;color:var(--navy)}
.fact.price b{font-size:20px}
.sec{padding:18px 20px;border-top:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sec-h h4{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--navy)}
.sec p{margin:0 0 10px;font-size:15px;line-height:1.6}.sec p:last-child{margin:0}
.sec.short{background:var(--ice)}
.sec.short pre{margin:0;font:inherit;font-size:15px;line-height:1.6;white-space:pre-wrap}
.script .acts,.pic .acts{flex-wrap:wrap}
.btn.mini{min-height:32px;padding:0 12px;font-size:13px;border-width:1px;flex:none}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
footer{background:var(--ice);color:var(--muted);font-size:13px}
footer .wrap{padding-top:18px;padding-bottom:18px}
@media(max-width:820px){.cards{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  nav.main button{padding:0 14px}
    .card img{width:96px}
  .script-top .acts .btn,.pic .acts .btn,.card .acts .btn{flex:1 1 130px}
  .script-top,.sec{padding-left:14px;padding-right:14px}
  .item{padding-left:4px;padding-right:4px}
  header img{height:64px}
  .drive .btn{width:100%}
  .tabs{width:100%}.tab{flex:1;padding:0 8px}
  .item{grid-template-columns:36px 1fr}
  .num{grid-row:1}
  .item .acts{grid-column:1/-1}.item .acts .btn{flex:1 1 calc(50% - 5px);padding:0 10px}
  .item .acts .btn.quiet{flex-basis:100%;border-color:var(--line)}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="assets/logo.png" alt="STEP IT Academy">
    <div>
      <h1>Зимовий ІТ табір</h1>
      <p>Матеріали уроків для викладачів</p>
    </div>
  </div>
</header>



<div class="drive">
  <div class="wrap">
    <div>
      <h2>Переглянути через Google Drive</h2>
      <p>Усі матеріали табору на Google Drive</p>
    </div>
    <a class="btn light" href="https://drive.google.com/drive/folders/14n_8HJ8vh18R6vT1AVtsTLnG__IfH1kS" target="_blank" rel="noopener">Відкрити Google Drive
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
  </div>
</div>

<nav class="main" aria-label="Розділи"><div class="wrap" role="tablist">
  <button role="tab" data-sec="lessons" aria-selected="true">Уроки</button>
  <button role="tab" data-sec="programs" aria-selected="false" hidden>Програми</button>
  <button role="tab" data-sec="photo" aria-selected="false" hidden>Фото</button>
  <button role="tab" data-sec="scripts" aria-selected="false" hidden>Скрипти</button>
</div></nav>

<main class="wrap">
  <section class="panel" id="sec-lessons">
  <div class="bar">
    <div class="tabs" role="group" aria-label="Вікова група">
      <button class="tab" data-age="6-8" aria-pressed="true">6–8 років<span class="cnt"></span></button>
      <button class="tab" data-age="9-14" aria-pressed="false">9–14 років<span class="cnt"></span></button>
    </div>
    <input id="q" type="search" placeholder="Пошук уроку" aria-label="Пошук уроку">
  </div>
  <ol id="list" class="list"></ol>
  </section>

  <section class="panel" id="sec-programs" hidden><div class="cards" id="programs-list"></div></section>
  <section class="panel" id="sec-photo" hidden><div class="photo" id="photo-list"></div></section>
  <section class="panel" id="sec-scripts" hidden><div class="tabs" role="group" aria-label="Скрипт для групи" id="script-tabs" style="margin-bottom:16px;display:inline-flex"></div><div id="scripts-list"></div></section>
</main>

<footer><div class="wrap">STEP IT Academy · Зимовий ІТ табір</div></footer>

<script src="lessons.js"></script>
<script src="materials.js"></script>
<script>
(function(){
  var all = window.LESSONS || [], q = "";
  var age = "6-8";
  var list = document.getElementById("list");
  var dl = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';
  var icoBook='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>';
  var icoFolder='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>';
  var icoSlides='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>';
  var icoExt='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function sync(){
    document.querySelectorAll("#sec-lessons .tab").forEach(function(t){
      var a=t.dataset.age;
      t.setAttribute("aria-pressed",a===age);
      var n=all.filter(function(l){return l.age===a}).length;
      t.querySelector(".cnt").textContent=n?n:"";
    });
  }
  function render(){
    sync();
    var items = all.filter(function(l){return l.age===age});
    items.forEach(function(l,i){l._n=i+1});
    items = items.filter(function(l){return (l.title+" "+(l.desc||"")).toLowerCase().indexOf(q)>-1});
    if(!items.length){list.innerHTML='<li class="empty">'+(q?"Нічого не знайдено.":"Уроки для цієї групи скоро з’являться.")+'</li>';return}
    list.innerHTML = items.map(function(l){
      var f = encodeURI(l.file), name = l.file.split("/").pop();
      var pres = l.presentation ? '<a class="btn blue" href="'+encodeURI(l.presentation)+'" target="_blank" rel="noopener" title="Відкрити презентацію до уроку в новій вкладці">'+icoSlides+'Презентація</a>' : "";
      var extra = (l.links||[]).map(function(x){return '<a class="btn line" href="'+esc(x.url)+'" target="_blank" rel="noopener" title="Відкрити папку «'+esc(x.label)+'» на Google Drive">'+icoFolder+esc(x.label)+'<span class="tag">Drive ↗</span></a>'}).join("");
      return '<li class="item"><span class="num">'+(l.day?'<small>День</small>'+l.day:String(l._n).padStart(2,"0"))+'</span>'+
        '<div><h3><a href="'+f+'" target="_blank" rel="noopener">'+esc(l.title)+'</a></h3>'+(l.desc?'<p>'+esc(l.desc)+'</p>':'')+'</div>'+
        '<div class="acts"><a class="btn" href="'+f+'" target="_blank" rel="noopener" title="Відкрити урок у новій вкладці">'+icoBook+'Відкрити урок</a>'+
        pres+extra+
        '<a class="btn quiet" href="'+f+'" download="'+esc(name)+'" title="Зберегти урок одним HTML-файлом на комп’ютер">'+dl+'Завантажити урок</a></div></li>';
    }).join("");
  }
  document.querySelectorAll("#sec-lessons .tab").forEach(function(b){
    b.addEventListener("click",function(){
      age=b.dataset.age;
      render();
    });
  });
  document.getElementById("q").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();render()});
  render();

  /* ---------- матеріали ---------- */
  var M = window.MATERIALS || {};
  function show(id){document.querySelector('nav.main [data-sec="'+id+'"]').hidden=false}
  function fn(f){return f.split("/").pop()}
  function ageLabel(a){return a?a.replace("-","–")+" років":""}
  var ico = {
    view:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'
  };
  function dlLink(f,label,cls){return '<a class="btn '+(cls||"line")+'" href="'+encodeURI(f)+'" download="'+esc(fn(f))+'">'+dl+label+'</a>'}

  if((M.programs||[]).length){
    show("programs");
    document.getElementById("programs-list").innerHTML = M.programs.map(function(x){
      var f=encodeURI(x.file);
      return '<article class="card">'+
        (x.preview?'<a href="'+f+'" target="_blank" rel="noopener"><img src="'+encodeURI(x.preview)+'" alt="'+esc(x.title)+'" loading="lazy"></a>':'')+
        '<div><h3 class="t">Програма навчання</h3><p class="m">'+esc(ageLabel(x.age))+' · PDF</p>'+
        '<div class="acts"><a class="btn sm" href="'+f+'" target="_blank" rel="noopener">'+ico.view+'Переглянути</a>'+dlLink(x.file,"Завантажити","line sm")+'</div></div></article>';
    }).join("");
  }

  if((M.photos||[]).length){
    show("photo");
    var pl=document.getElementById("photo-list");
    pl.innerHTML = M.photos.map(function(x){
      var f=encodeURI(x.file);
      return '<article class="pic"><a class="thumb" href="'+f+'" target="_blank" rel="noopener"><img src="'+f+'" alt="'+esc(x.title)+'" loading="lazy"></a>'+
        '<div class="info"><p class="cap">'+esc(x.title)+'<small>JPG</small></p>'+
        '<div class="acts">'+dlLink(x.file,"Завантажити","sm")+
        '<a class="btn line sm" href="'+f+'" target="_blank" rel="noopener">'+ico.view+'Відкрити</a></div></div></article>';
    }).join("");
    pl.querySelectorAll("img").forEach(function(im){
      function dim(){var sm=im.closest(".pic").querySelector("small");if(im.naturalWidth)sm.textContent=im.naturalWidth+" × "+im.naturalHeight+" · JPG"}
      if(im.complete)dim();else im.addEventListener("load",dim);
    });
  }

  function lineText(l){return (l.h?l.h+" ":"")+l.t}
  function blockText(b){return b.title+"\n"+b.lines.map(lineText).join("\n")}
  function fullText(x){return x.name+"\n\n"+x.facts.map(function(f){return f[0]+": "+f[1]}).join("\n")+"\n\n"+x.blocks.map(blockText).join("\n\n")+"\n\nКоротке повідомлення\n"+x.short}
  function copyText(txt,btn){
    var lab=btn.querySelector("span");
    function done(){var o=lab.textContent;lab.textContent="Скопійовано";setTimeout(function(){lab.textContent=o},1800)}
    function fallback(){var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(_){}document.body.removeChild(t)}
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done,fallback)}else fallback();
  }
  if((M.scripts||[]).length){
    show("scripts");
    var sbox=document.getElementById("scripts-list"), stabs=document.getElementById("script-tabs"), cur=0;
    stabs.innerHTML=M.scripts.map(function(x,i){return '<button class="tab" type="button" data-i="'+i+'" aria-pressed="'+(i===0)+'">'+esc(ageLabel(x.age))+'</button>'}).join("");
    function renderScript(){
      var x=M.scripts[cur];
      stabs.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-pressed",+t.dataset.i===cur)});
      sbox.innerHTML='<article class="script"><div class="script-top"><h3>'+esc(x.name)+'</h3>'+
        '<div class="facts">'+x.facts.map(function(f){return '<div class="fact'+(f[0]==="Вартість"?' price':'')+'"><span>'+esc(f[0])+'</span><b>'+esc(f[1])+'</b></div>'}).join("")+'</div>'+
        '<div class="acts"><button class="btn sm" type="button" data-all><span>Копіювати весь скрипт</span></button>'+
        (x.file?dlLink(x.file,"Завантажити .docx","line sm"):"")+'</div></div>'+
        x.blocks.map(function(b,bi){
          return '<section class="sec"><div class="sec-h"><h4>'+esc(b.title)+'</h4><button class="btn line mini" type="button" data-b="'+bi+'"><span>Копіювати</span></button></div>'+
            b.lines.map(function(l){return '<p>'+(l.h?'<strong>'+esc(l.h)+'</strong> ':'')+esc(l.t)+'</p>'}).join("")+'</section>';
        }).join("")+
        '<section class="sec short"><div class="sec-h"><h4>Коротке повідомлення для месенджера</h4><button class="btn line mini" type="button" data-s><span>Копіювати</span></button></div><pre>'+esc(x.short)+'</pre></section></article>';
    }
    stabs.addEventListener("click",function(e){var t=e.target.closest(".tab");if(!t)return;cur=+t.dataset.i;renderScript()});
    sbox.addEventListener("click",function(e){
      var btn=e.target.closest("button");if(!btn)return;var x=M.scripts[cur];
      if(btn.hasAttribute("data-all"))copyText(fullText(x),btn);
      else if(btn.hasAttribute("data-s"))copyText(x.short,btn);
      else if(btn.dataset.b!==undefined)copyText(blockText(x.blocks[+btn.dataset.b]),btn);
    });
    renderScript();
  }
  /* ---------- перемикання розділів ---------- */
  var secs=["lessons","programs","photo","scripts"], sec="lessons";
  var navBtns=document.querySelectorAll("nav.main [data-sec]");
  function curAge(){
    if(sec==="lessons"){var t=document.querySelector("#sec-lessons .tab[aria-pressed='true']");return t?t.dataset.age:""}
    if(sec==="scripts"){var t2=document.querySelector("#script-tabs .tab[aria-pressed='true']");return t2?M.scripts[+t2.dataset.i].age:""}
    return "";
  }
  function writeHash(){var a=curAge();try{history.replaceState(null,"","#"+sec+(a?"/"+a:""))}catch(e){}}
  function setSection(id){
    var btn=document.querySelector('nav.main [data-sec="'+id+'"]');
    if(!btn||btn.hidden)id="lessons";
    sec=id;
    secs.forEach(function(s){document.getElementById("sec-"+s).hidden=(s!==id)});
    navBtns.forEach(function(b){b.setAttribute("aria-selected",b.dataset.sec===id)});
    writeHash();
  }
  function applyHash(){
    var h=decodeURIComponent(location.hash.slice(1)), parts=h.split("/"), id=parts[0], a=parts[1];
    if(/^(6-8|9-14)$/.test(id)){a=id;id="lessons"}   // старі посилання виду #9-14
    if(secs.indexOf(id)<0)id="lessons";
    setSection(id);
    if(a){
      var t=id==="lessons"?document.querySelector('#sec-lessons .tab[data-age="'+a+'"]'):null;
      if(id==="scripts"){var i=(M.scripts||[]).findIndex(function(x){return x.age===a});if(i>-1)t=document.querySelector('#script-tabs .tab[data-i="'+i+'"]')}
      if(t){t.click();writeHash()}
    }
  }
  navBtns.forEach(function(b){b.addEventListener("click",function(){
    setSection(b.dataset.sec);
    var m=document.querySelector("main");if(m.getBoundingClientRect().top<54)m.scrollIntoView();
  })});
  document.addEventListener("click",function(e){if(e.target.closest(".tab"))writeHash()});
  window.addEventListener("hashchange",applyHash);
  applyHash();
})();
</script>
</body>
</html>
